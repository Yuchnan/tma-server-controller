services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tma-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
    deploy:
      resources:
        limits:
          memory: 250M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tma-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 150M