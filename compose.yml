services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tma-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 200M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tma-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    deploy:
      resources:
        limits:
          memory: 150M